<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1050px" height="242px" viewBox="-70 25 1050 242" xml:space="preserve">
	<style type="text/css">
	<![CDATA[
		.pad    { fill: #b0bec5; }
		.open   { fill: #0077c8; }
		.closed { fill: #0033a0; }
		.divln  { stroke: #ffffff; stroke-width: 1.5; fill: none; }
		.t-head { fill: #ffffff; font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; }
		.t-sub  { fill: #ffffff; font-family: Arial, sans-serif; font-size: 11px; }
		.s-lbl  { fill: #333f48; font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; }
		.a-solid{ stroke: #008bab; stroke-width: 1.5; fill: none; }
		.a-dash { stroke: #008bab; stroke-width: 1.5; fill: none; stroke-dasharray: 6,4; }
		.a-head { fill: #008bab; }
		.lbl    { fill: #333f48; font-family: Arial, sans-serif; font-size: 11px; }
		.lbl-i  { fill: #333f48; font-family: Arial, sans-serif; font-size: 10px; font-style: italic; }
		.title  { fill: #333f48; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
	]]>
	</style>
	<defs>
		<clipPath id="lh1"><rect x="0"   y="100" width="155" height="120"/></clipPath>
		<clipPath id="rh1"><rect x="155" y="100" width="200" height="120"/></clipPath>
		<clipPath id="lh2"><rect x="0"   y="100" width="490" height="120"/></clipPath>
		<clipPath id="rh2"><rect x="490" y="100" width="200" height="120"/></clipPath>
		<clipPath id="lh3"><rect x="0"   y="100" width="835" height="120"/></clipPath>
		<clipPath id="rh3"><rect x="835" y="100" width="200" height="120"/></clipPath>
		<marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
			<polygon points="0 0, 8 3, 0 6" class="a-head"/>
		</marker>
		<marker id="arr-dash" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
			<polygon points="0 0, 8 3, 0 6" class="a-head"/>
		</marker>
	</defs>

	<text x="490" y="45" class="title" text-anchor="middle">Secure AP-Protect</text>

	<!-- State 1: NSPE open (Debug open), SPE closed (Debug blocked) -->
	<ellipse cx="155" cy="165" rx="130" ry="47" class="pad"/>
	<ellipse cx="155" cy="165" rx="125" ry="42" class="open"   clip-path="url(#lh1)"/>
	<ellipse cx="155" cy="165" rx="125" ry="42" class="closed" clip-path="url(#rh1)"/>
	<line x1="155" y1="118" x2="155" y2="212" class="divln"/>
	<text x="155" y="99"  class="s-lbl"  text-anchor="middle">Secure AP-Protect enabled</text>
	<text x="155" y="113" class="s-lbl"  text-anchor="middle">AP-Protect disabled</text>
	<text x="93"  y="158" class="t-head" text-anchor="middle">NSPE</text>
	<text x="93"  y="172" class="t-sub"  text-anchor="middle">Debug open</text>
	<text x="15"  y="168" class="lbl-i"  text-anchor="end">(default)</text>
	<text x="217" y="158" class="t-head" text-anchor="middle">SPE</text>
	<text x="217" y="172" class="t-sub"  text-anchor="middle">Debug blocked</text>

	<!-- State 2: NSPE open (Debug open), SPE open (Debug open) -->
	<ellipse cx="490" cy="165" rx="130" ry="47" class="pad"/>
	<ellipse cx="490" cy="165" rx="125" ry="42" class="open" clip-path="url(#lh2)"/>
	<ellipse cx="490" cy="165" rx="125" ry="42" class="open" clip-path="url(#rh2)"/>
	<line x1="490" y1="118" x2="490" y2="212" class="divln"/>
	<text x="490" y="99"  class="s-lbl"  text-anchor="middle">Secure AP-Protect disabled</text>
	<text x="490" y="113" class="s-lbl"  text-anchor="middle">AP-Protect disabled</text>
	<text x="428" y="158" class="t-head" text-anchor="middle">NSPE</text>
	<text x="428" y="172" class="t-sub"  text-anchor="middle">Debug open</text>
	<text x="552" y="158" class="t-head" text-anchor="middle">SPE</text>
	<text x="552" y="172" class="t-sub"  text-anchor="middle">Debug open</text>

	<!-- State 3: NSPE closed (Debug blocked), SPE closed (Debug blocked) -->
	<ellipse cx="835" cy="165" rx="130" ry="47" class="pad"/>
	<ellipse cx="835" cy="165" rx="125" ry="42" class="closed" clip-path="url(#lh3)"/>
	<ellipse cx="835" cy="165" rx="125" ry="42" class="closed" clip-path="url(#rh3)"/>
	<line x1="835" y1="118" x2="835" y2="212" class="divln"/>
	<text x="835" y="99"  class="s-lbl"  text-anchor="middle">Secure AP-Protect enabled</text>
	<text x="835" y="113" class="s-lbl"  text-anchor="middle">AP-Protect enabled</text>
	<text x="773" y="158" class="t-head" text-anchor="middle">NSPE</text>
	<text x="773" y="172" class="t-sub"  text-anchor="middle">Debug blocked</text>
	<text x="897" y="158" class="t-head" text-anchor="middle">SPE</text>
	<text x="897" y="172" class="t-sub"  text-anchor="middle">Debug blocked</text>

	<!-- A1: State 1 to State 2 -->
	<path d="M 280,152 Q 322,95 365,152" class="a-solid" marker-end="url(#arr)"/>
	<text x="322" y="60" class="lbl" text-anchor="middle">ERASEALL through CTRL-AP</text>
	<text x="322" y="73" class="lbl" text-anchor="middle">Configure UICR.SECUREAPPROTECT</text>
	<text x="322" y="86" class="lbl" text-anchor="middle">+ configure Kconfig and flash firmware</text>

	<!-- A2: State 2 to State 1 (dashed, any reset) -->
	<path d="M 365,178 Q 322,232 280,178" class="a-dash" marker-end="url(#arr-dash)"/>
	<text x="322" y="188" class="lbl" text-anchor="middle">Any reset</text>

	<!-- A3: State 2 to State 3 -->
	<path d="M 615,152 Q 662,95 710,152" class="a-solid" marker-end="url(#arr)"/>
	<text x="662" y="79" class="lbl" text-anchor="middle">Enable AP-Protect + reset</text>

	<!-- A4: State 3 to State 1 (big arc below all states) -->
	<path d="M 835,212 Q 495,265 155,212" class="a-solid" marker-end="url(#arr)"/>
	<text x="495" y="253" class="lbl" text-anchor="middle">ERASEALL through CTRL-AP</text>
</svg>
